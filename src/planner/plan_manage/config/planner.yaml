scan_planner_node:
  ros__parameters:
    use_sim_time: false

    fsm.navi_mode: 1
    fsm.thresh_replan: 1.0
    fsm.thresh_no_replan: 0.1
    fsm.planning_horizon: 7.5
    # A long Euclidean lookahead can jump across adjacent maze corridors.
    # Reference paths therefore use a shorter arc-length lookahead.
    fsm.reference_path_lookahead: 4.5
    fsm.emergency_time: 1.0
    fsm.rolling_replan_retry_period: 0.25
    fsm.rolling_replan_max_start_error: 0.30
    # A future collision first requests a rolling A* + B-spline replacement.
    # HOLD is reserved for the dynamic stopping horizon.
    fsm.predictive_replan_reaction_time: 0.25
    # Tracking mismatch remains a local SCAN repair problem.  A virtual
    # recovery corridor does not by itself invalidate the Explorer route.
    fsm.tracking_degraded_error: 0.10
    fsm.tracking_recovery_max_error: 0.30
    fsm.tracking_match_back_time: 0.40
    fsm.tracking_match_forward_time: 0.80
    # The physical capsule remains radius=0.35 m with +/-0.18 m body centres.
    # This is an additional hard planning belt checked only against immutable
    # local-map snapshots; it is not baked into the map and does not enlarge
    # Explorer's global obstacles.
    fsm.planning_clearance_margin: 0.10
    # Only after ordinary rolling repair fails, try short local anchors that
    # move away from the hard planning belt before rejoining the unchanged
    # Explorer reference path. These bounds keep recovery local and cheap.
    fsm.local_repair_anchor_min_distance: 0.45
    fsm.local_repair_anchor_max_distance: 0.90
    fsm.local_repair_anchor_step: 0.15
    fsm.local_repair_max_backtrack: 0.60
    fsm.local_repair_max_candidates: 6
    # Runtime safety predicts the actual odometry velocity through reaction
    # and braking, sampling a short swept capsule instead of assuming that the
    # robot remains exactly on the theoretical B-spline.
    fsm.braking_sweep_spatial_step: 0.05
    # 4 s covers a full stop from the observed ~0.85 m/s even with the
    # conservative 0.32 m/s^2 guaranteed deceleration below.
    fsm.braking_sweep_max_horizon: 4.0
    # Stale perception or a severely delayed safety callback must HOLD, not
    # merely print a warning. Recovery requires consecutive fresh callbacks.
    fsm.safety_map_stale_warn_age: 0.25
    fsm.safety_map_stale_hold_age: 0.50
    fsm.safety_callback_hold_gap: 0.30
    fsm.local_hold_release_cycles: 3
    # Gazebo quadruped odometry oscillates within every gait cycle. Use a
    # short world-frame pose history plus low-pass estimates instead of one
    # raw body-frame twist sample.
    fsm.odom_velocity_filter_tau: 0.20
    fsm.motion_estimation_window: 0.35
    fsm.yaw_rate_filter_tau: 0.15
    # Trajectory acceleration is not a guaranteed RL-policy stopping rate.
    # Keep the safety contract independent and conservative; normal operation
    # still requests a rolling local repair before this final HOLD envelope.
    fsm.guaranteed_braking_deceleration: 0.32
    fsm.command_stop_latency: 0.30
    # A new Explorer path cannot clear a physical pose-occupied latch.  Require
    # consecutive free Local-map observations before planning resumes.
    fsm.pose_free_release_cycles: 3
    fsm.predictive_hard_stop_min_time: 0.35
    fsm.goal_tolerance: 0.25
    fsm.heading_freeze_max_recoveries: 2
    fsm.fail_safe: true
    fsm.max_replan_fail_count: 5

    grid_map.resolution: 0.05
    grid_map.sliding_map_size_x: 10.0
    grid_map.sliding_map_size_y: 10.0
    grid_map.sliding_map_size_z: 5.0
    grid_map.local_update_range_x: 5.0
    grid_map.local_update_range_y: 5.0
    grid_map.local_update_range_z: 2.5
    grid_map.map_sliding_en: true
    grid_map.map_sliding_thresh: 0.2
    # Keep the planned body centre outside the simulator's 0.30 m collision
    # radius, with a small allowance for voxelization and tracking error.
    grid_map.double_cylinder_radius: 0.35
    grid_map.double_cylinder_offset: 0.18
    grid_map.self_filter_enabled: true
    grid_map.self_filter_z_down: 0.45
    grid_map.self_filter_z_up: 0.20
    grid_map.body_height: 0.4
    # The reference path from Explorer is 2D: it runs A* in the plane and
    # writes z = 0.0, so the path z carries no terrain height.  A fixed
    # body_height offset is only correct on flat ground; with the robot on a
    # ledge the trajectory ends up inside the terrain and every replan
    # collides at t = 0.  Tracking the live odometry height is correct on
    # flat ground and on ledges alike.  Set false to restore the fixed offset.
    grid_map.live_body_height: true
    grid_map.obstacles_inflation_z_up: 0.1
    grid_map.obstacles_inflation_z_down: 0.4
    grid_map.frame_id: world
    grid_map.sliding_map_frame_id: sliding_map
    grid_map.ground_height: 0.0
    grid_map.sensor_type: lidar
    grid_map.cloud_is_world: true
    grid_map.need_extrinsic: false
    grid_map.pose_history_seconds: 0.50
    grid_map.max_interpolation_gap: 0.05
    grid_map.max_nearest_pose_age: 0.02
    # Default real-robot IMU/lidar deployment transform. Gazebo overrides
    # these from run.launch.py with the robot.xacro lidar_joint transform.
    grid_map.lidar_extrinsic_x: -0.011
    grid_map.lidar_extrinsic_y: -0.02329
    grid_map.lidar_extrinsic_z: 0.04412
    grid_map.lidar_extrinsic_roll: 0.0
    grid_map.lidar_extrinsic_pitch: 0.0
    grid_map.lidar_extrinsic_yaw: 0.0

    grid_map.cx: 321.04638671875
    grid_map.cy: 243.44969177246094
    grid_map.fx: 387.229248046875
    grid_map.fy: 387.229248046875
    grid_map.depth_filter_maxdist: 3.0
    grid_map.depth_filter_mindist: 0.3
    grid_map.depth_filter_margin: 1
    grid_map.k_depth_scaling_factor: 1000.0
    grid_map.skip_pixel: 2

    grid_map.p_hit: 0.85
    grid_map.p_miss: 0.30
    grid_map.p_min: 0.12
    grid_map.p_max: 0.98
    grid_map.p_occ: 0.80
    grid_map.max_ray_length: 5.0
    grid_map.vis_height: 0.3
    grid_map.show_occ_time: false
    # Shadow global-representation input. After a fusion revision completes, it
    # samples the consistent inflated map without acquiring another map lock.
    grid_map.local_patch_enabled: true
    grid_map.local_patch_period: 0.5
    grid_map.local_patch_resolution: 0.2
    # Absolute fallback used only before the first valid body_pose. During
    # normal operation the gravity-aligned patch follows a filtered body z.
    grid_map.local_patch_z: 0.3
    grid_map.local_patch_follow_body_z: true
    grid_map.local_patch_z_filter_tau: 0.75
    grid_map.local_patch_z_max_rate: 0.5

    manager.max_vel: 0.75
    manager.max_acc: 0.5
    manager.max_jerk: 4.0
    manager.control_points_distance: 0.2
    manager.feasibility_tolerance: 0.5
    manager.planning_horizon: 7.5

    optimization.lambda_smooth: 1.0
    optimization.lambda_collision: 1.0
    optimization.lambda_feasibility: 0.1
    optimization.lambda_fitness: 1.0
    optimization.dist0: 0.10
    optimization.max_vel: 0.75
    optimization.max_acc: 0.5
    optimization.order: 3

closed_loop_controller:
  ros__parameters:
    use_sim_time: false
    time_forward: 0.8
    heading_error_threshold: 0.8
    # Freeze trajectory time while turning, but report a stall if the error
    # fails to improve so SCAN can regenerate the local segment.
    heading_stall_timeout: 3.0
    heading_progress_epsilon: 0.05
    kp_pos: 0.8
    # Certified initial alignment adds up to 0.35 rad/s yaw bias at 0.25 rad/s²
    # only after 0.30 s without progress and measured |yaw_rate| < 0.08.
    # Candidate yaw limits, pose envelope, stall timeout and settling still apply.
    kp_yaw: 1.5
    max_vx: 0.75
    max_vy: 0.35
    max_vyaw: 1.0
    # Bspline.use_measured_progress chooses physical rather than reference-time
    # progress independently of these caps and of min_forward_command. Local
    # task trajectories use it in normal mode as well as clearance-limited mode.
    # Ordinary capture tolerance. A capture latches zero command; FINISHED
    # requires fresh measured linear/angular rest after 0.30 s. New certified
    # candidates may replace the active prefix directly before capture.
    # Fixed-yaw recovery limits shortfall to
    # min(0.03 m, 20% of planned distance), and bounds overshoot by Local's
    # certified capture extension. Failed recovery needs fresh stopped normal
    # rejoin certification; it is never promoted to FINISHED.
    # MODE_FORWARD_TURN_STAGE has a separate Local-certified 0.15 m capture
    # region, 0.08 m cross-track and 0.10 m overrun bounds. It brakes from
    # measured speed using the latency/deceleration carried by Bspline;
    # it never waits indefinitely to pass the old 0.03 m point tolerance.
    finish_dist: 0.15
    # Legacy non-task search only. Task installation uses Local's certified
    # matched time, measured pose and target yaw carried by Bspline.
    handoff_search_time: 1.0
    handoff_sample_dt: 0.02
    max_handoff_error: 0.30
    # At rest a validated recovery connector may span up to 0.30 m.  As speed
    # rises, reaction and braking distance tighten this limit toward 0.10 m.
    min_moving_handoff_error: 0.10
    handoff_reaction_time: 0.25
    handoff_max_deceleration: 0.50
    # Large heading jumps while moving require Local's certified conversion.
    # A certified initial turn holds translation through Local-certified 0.05--0.12 rad heading
    # error and three fresh linear/angular rest samples. Unfinished alignment
    # survives candidate replacement; ordinary tracking uses its hysteresis.
    # Installation allows 0.02 m error. Turn execution uses Local's explicit
    # footprint-certified drift envelope (at most 0.10 m), never a wider guess.
    max_handoff_yaw_error: 0.80
    handoff_moving_alignment_tolerance: 0.0
    handoff_moving_speed_limit: 0.0

open_loop_controller:
  ros__parameters:
    use_sim_time: false
    frame_id: world
    child_frame_id: base
    publish_rate: 100.0
    yaw_min_speed: 0.05
    hold_final_position: true
    init_x: -19.0
    init_y: 1.0
    init_z: 0.3
    init_yaw: 0.0

go2_kinematic_sim:
  ros__parameters:
    use_sim_time: false
    init_x: -19.0
    init_y: 1.0
    init_z: 0.3
    init_yaw: 0.0
    max_vx: 0.75
    max_vy: 0.35
    max_vyaw: 1.0
    cmd_timeout: 0.3
    sim_rate: 100.0
    publish_tf: true
    frame_id: world
    child_frame_id: base

go2_gait_publisher:
  ros__parameters:
    use_sim_time: false
    rate: 60.0
    gait_frequency: 2.2
    min_walk_speed: 0.05
    max_walk_speed: 1.0
    always_trot: false
    hip_swing: 0.08
    thigh_swing: 0.32
    calf_swing: 0.42

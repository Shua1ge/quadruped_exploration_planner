const $ = s => document.querySelector(s);
const view = $('#view'), drawer = $('#drawer'), dbody = $('#drawer-body');

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stBadge = st => `<span class="badge st-${st}">${st}</span>`;
function openDrawer(html){dbody.innerHTML = `<button class="close" aria-label="关闭" onclick="closeDrawer()">✕</button>`+html;drawer.classList.add('open')}
function closeDrawer(){drawer.classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

function openSpec(id){
  const s = DATA.specs.find(x=>x.id===id); if(!s) return;
  openDrawer(`<h2>${stBadge(s.status)} ${esc(s.title)}</h2>
    <div class="kv">角色 <b>${esc(s.cornerName)}</b> · 规格节 ${esc(s.sec)}</div>
    <div class="sec">正文</div><p style="font-size:13px;margin:4px 0;white-space:pre-line">${esc(s.body)}</p>
    ${s.todos&&s.todos.length?`<div class="sec">待填</div><ul class="tight">${s.todos.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
    ${s.refs?`<div class="sec">参照</div><div class="kv"><span class="tag">${esc(s.refs)}</span></div>`:''}`);
}
function selCorner(id){
  const c = DATA.corners[id];
  openDrawer(`<h2>${esc(c.name)}</h2>
    <div class="kv">${esc(c.tagline)}</div>
    <div class="sec">定义与权威</div><p style="font-size:13px;margin:4px 0">${esc(c.definition)}</p>
    <div class="sec">拥有</div><ul class="tight">${c.owns.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="sec">刻意不拥有(防越权)</div><ul class="tight">${c.not_owns.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="sec">规格条目(点开看正文;⬜=待填)</div>
    ${c.specs.map(sid=>{const s=DATA.specs.find(x=>x.id===sid);
      return s?`<div class="specsec ${s.status==='待填'?'todo':''}" onclick="openSpec('${s.id}')">
        <div class="st">${stBadge(s.status)} ${esc(s.title)}</div>
        <div class="sb">${esc(s.body).slice(0,120)}${s.body.length>120?'…':''}</div></div>`:'<div class="kv">—</div>'}).join('')}
    <div class="sec">完整叙事</div>
    <div class="kv">CONTRACT_STACK_SPEC_ZH.txt 第 ${esc(c.spec_sec)} 节 · ${esc(c.spec_note)}</div>`);
}
function selProtocol(id){
  const p = DATA.protocols.find(x=>x.id===id);
  openDrawer(`<h2>${esc(p.id)} · ${esc(p.label)}</h2>
    <div class="kv">${esc(p.fromName)} → ${esc(p.toName)} · ${esc(p.carrier)}</div>
    <div class="sec">载荷字段</div><ul class="tight">${p.fields.map(f=>`<li><span class="tag">${esc(f)}</span></li>`).join('')}</ul>
    <div class="sec">纪律</div><p style="font-size:13px;margin:4px 0">${esc(p.discipline)}</p>
    <div class="sec">备注</div><p style="font-size:13px;margin:4px 0">${esc(p.note)}</p>`);
}
function renderTriangle(){
  const C = DATA.corners, P = DATA.protocols;
  const pos = {explorer:[440,70], global:[150,470], local:[730,470]};
  let edges='',labels='',corners='';
  const pathCfg = {
    P1:{pts:[[600,130],[880,470]],bend:-40},
    P2:{pts:[[880,530],[600,190]],bend:-40},
    P3:{pts:[[730,530],[450,530]],bend:26},
    P4:{pts:[[300,470],[470,190]],bend:-30},
  };
  for(const p of P){
    const [x1,y1]=pathCfg[p.id].pts[0], [x2,y2]=pathCfg[p.id].pts[1];
    const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len,ny=dx/len,off=pathCfg[p.id].bend;
    const cx=mx+nx*off,cy=my+ny*off;
    edges+=`<path class="pedge" id="pe-${p.id}" d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}"/>`;
    labels+=`<text class="plabel" id="pl-${p.id}" x="${cx}" y="${cy}" text-anchor="middle" onclick="selProtocol('${p.id}')">${p.id} ${esc(p.label)} ›</text>`;
  }
  for(const id of ['explorer','global','local']){
    const c=C[id],[x,y]=pos[id];
    corners+=`<g class="corner" id="corner-${id}" onclick="selCorner('${id}')" tabindex="0" role="button" aria-label="${esc(c.name)}"
      onkeydown="if(event.key==='Enter')selCorner('${id}')">
      <rect x="${x}" y="${y}" width="300" height="130" rx="10"/>
      <rect x="${x}" y="${y}" width="5" height="130" rx="2" fill="${c.color}"/>
      <text x="${x+16}" y="${y+30}">${esc(c.name)}</text>
      <text class="sub" x="${x+16}" y="${y+52}">${esc(c.tagline)}</text>
      <text class="hint" x="${x+16}" y="${y+78}">▸ 点击:定义/权威/规格</text>
      <text class="sub" x="${x+16}" y="${y+102}">拥有 ${c.owns.length} 项 · 规格 ${c.specs.length} 条 · 待填 ${c.todos.length}</text></g>`;
  }
  view.innerHTML = `<div style="position:relative">
    <svg viewBox="0 0 1180 660" width="100%" style="max-width:1180px" role="img" aria-label="契约三角图">
      ${edges}${labels}${corners}</svg></div>
    <div class="note">三顶点 = 三个角色(各拥有图 1/2/3 之一);<b>边 = 四条跨层协议</b>(点击看载荷字段与纪律)。
    角色间的权威裁决见「权威阶梯」tab。本页与 CONTRACT_STACK_SPEC_ZH.txt 逐节对应。</div>`;
}
function renderLadder(){
  view.innerHTML = `<div class="sec">五个不可归约的问题 → 五个权威(违反即产生对账协议)</div>
    <table class="ladder"><tr><th style="width:34%">问题</th><th style="width:22%">权威</th><th>结构与位置</th><th>违例实证</th></tr>
    ${DATA.ladder.map(r=>`<tr><td><b>${esc(r.q)}</b></td><td>${esc(r.who)}</td><td>${esc(r.struct)}<br><span class="tag">${esc(r.loc)}</span></td><td>${esc(r.violation)}</td></tr>`).join('')}
    </table>
    <div class="sec">裁决顺序</div>
    <p style="font-size:13px;margin:4px 0">${esc(DATA.ladderOrder)}</p>
    <div class="note">判定规则:任何一个状态转换,必须能指出它的权威是谁;找不到权威的转换 = 设计缺陷(实证:A7)。</div>`;
}
let specFilter = 'all';
function renderSpecs(){
  const fs = DATA.specs.filter(s=>(specFilter==='all'||s.status===specFilter));
  view.innerHTML = `<div class="fchips" role="group" aria-label="状态过滤" style="display:flex;gap:6px;margin-bottom:10px">
      ${['all','已实现','草案','待填'].map(s=>`<button aria-pressed="${specFilter===s}" onclick="setSpecFilter('${s}')" style="border:1px solid var(--line);background:var(--card);border-radius:14px;padding:3px 12px;font-size:12px;cursor:pointer">${s==='all'?'全部':s}</button>`).join('')}</div>
    ${fs.length?fs.map(s=>`<div class="specsec ${s.status==='待填'?'todo':''}" onclick="openSpec('${s.id}')">
      <div class="st">${stBadge(s.status)} [${esc(s.cornerName)}] ${esc(s.title)}</div>
      <div class="sb">${esc(s.body)}</div></div>`).join(''):'<div class="empty">无匹配规格</div>'}
    <div class="note">状态:✅已实现 · 🟠草案 · ⬜待填(需要实验数字或外部输入)。详细正文见 CONTRACT_STACK_SPEC_ZH.txt 对应节。</div>`;
}
function setSpecFilter(s){specFilter=s;renderSpecs()}
function renderPrinciples(){
  view.innerHTML = `<div class="sec">设计原则(纪律)</div>
    ${DATA.principles.map(p=>`<div class="principle"><div class="pn">${esc(p.n)}</div><div class="pb">${esc(p.b)}</div></div>`).join('')}
    <div class="sec">决策记录(为什么不做 XX)</div>
    ${DATA.decisions.map(d=>`<div class="principle"><div class="pn">${esc(d.id)} ${esc(d.title)}</div><div class="pb">${esc(d.body)}</div></div>`).join('')}`;
}
let curView = 'triangle';
function render(){
  if(curView==='triangle')renderTriangle();
  else if(curView==='ladder')renderLadder();
  else if(curView==='specs')renderSpecs();
  else renderPrinciples();
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected','false'));
  b.setAttribute('aria-selected','true');curView=b.dataset.v;render();
}));
render();
</script>
